services:
  porto-bot:
    image: ghcr.io/aer35/porto-bot:latest
    # Fixed container name, so it reads the same on every host instead of picking up the folder
    # name. It must be unique on the machine: for a second copy, change the service name and this
    # to match, e.g. porto-bot-2.
    container_name: porto-bot
    env_file: .env
    volumes:
      # <where on the host>:<where in the container>. The bot keeps everything in one SQLite file,
      # /data/porto.db inside the container (DB_PATH in .env), so /data must be kept between
      # restarts and updates. `data` is a Docker named volume, declared at the bottom of this file.
      # To keep the file in a folder or dataset you choose instead, put its path on the left, e.g.
      # /mnt/tank/apps/porto-bot:/data; the bot runs as user 1000 and needs write access there.
      - data:/data
    restart: unless-stopped

  # Development: `docker compose --profile dev up porto-bot-dev`. Name the service, or the
  # production bot starts too and both answer every command. Separate volume, so dev data stays apart.
  porto-bot-dev:
    profiles: [dev]
    container_name: porto-bot-dev
    build:
      context: .
      target: build
    command: npx tsx watch src/index.ts
    env_file: .env
    volumes:
      # Live code: tsx watch reloads when these change on the host.
      - ./src:/app/src
      - ./migrations:/app/migrations
      # A separate named volume for the dev database, so dev data never touches production's.
      - dev-data:/data

volumes:
  data:
  dev-data:
